# learn_camera_d435 ROS 参数
#
# 路径都是本机绝对路径；换机器/换模型时改这里即可，不用改代码。

d435_camera:
  ros__parameters:
    width: 640
    height: 480
    fps: 30
    frame_id: camera_color_optical_frame
    # 深度空间/时间滤波。黑色/哑光表面吸收红外，深度会有空洞，开空间
    # 滤波能把邻近的有效点填进去；temporal 会拖影，物体在动时必须关。
    depth_filter: true
    depth_temporal: false
    # 红外投射器。黑色/哑光表面吸收红外，深度会出现大面积空洞，
    # 黑色物体给满 360（D435i 上限）。镜面反光角度仍然会丢点，
    # 那个调功率解决不了，得改拍摄角度。
    laser_power: 360.0
    emitter_enabled: true
    # 彩色相机曝光。物体是黑色、L 形灯条发光，自动曝光会被灯条带偏，
    # 把黑色本体压进噪声里，所以改手动。目标是本体灰度落在 40~90：
    #   exposure 单位 100µs，150 = 15ms；超过 166（约 1/60s）运动就糊。
    #   画面整体太暗先加 gain，仍不够再小幅加 exposure。
    auto_exposure: false
    exposure: 150.0
    gain: 120.0
    # 0=关闭，1=50Hz，2=60Hz，3=自动；国内市电选 1，减少频闪条纹
    power_line_frequency: 1
    sharpness: 50
    color_topic: /camera/color/image_raw
    depth_topic: /camera/depth/image_raw
    camera_info_topic: /camera/color/camera_info

yolo_detector:
  ros__parameters:
    model_path: /home/cheng/datasets/part4_yolo/runs/part4_v2_132/weights/best.pt
    class_name: part4
    # 注意：这里故意用较低的验证阈值，保证跟踪阶段还能拿到框。
    # FoundationPose 节点用自己的 det_acquire_conf 决定是否注册。
    conf: 0.25
    device: "0"
    process_rate: 30.0
    publish_debug_image: true
    image_topic: /camera/color/image_raw
    detections_topic: /yolo/detections
    debug_image_topic: /yolo/debug_image

foundationpose:
  ros__parameters:
    mesh_path: /home/cheng/learn_ws/src/learn_camera_d435/models/energy_unit_textured.obj
    mesh_scale: 1.0

    mask_mode: sam
    sam_checkpoint: /home/cheng/test/RCIA_Benmao_Vision/models/sam/sam_vit_b_01ec64.pth
    sam_model_type: vit_b
    sam_select: score
    # 6GB 桌面卡保持 false（每次用完释放）；Jetson 16GB 统一内存可设 true，
    # 避免每次注册都重新加载 SAM（省 1~2 秒）
    sam_keep_loaded: false

    est_refine_iter: 5
    # 跟踪迭代次数：1 更流畅（实测约 26Hz），2 更准但只有约 15Hz。
    # 如果发现快速运动时位姿明显漂移，再改回 2。
    track_refine_iter: 1
    crop_ratio: 1.2
    # 朝向过滤：相机看不到物体背面时，只保留可见面一侧的初始朝向假设。
    # vis_dir 是 mesh 坐标系里「从物体指向相机」的方向，可由一次成功注册
    # 的位姿反算：d = normalize(-R^T t)。
    # rot_filter_deg=90 表示可见半球（252 -> 126 个假设，注册约减半）；
    # 60 更快但要求放置朝向更固定；0 关闭过滤。
    rot_filter_deg: 90.0
    vis_dir: [-0.389, -0.195, 0.900]
    # 注册后的稳定性验证：先跟踪 settle_frames 帧，窗口内所有位姿相对
    # 首帧的偏差都不超过阈值才提交（发布）位姿；超时仍不稳定则丢弃本次
    # 锁定、回到搜索。settle_frames: 0 关闭验证（注册完立即发布）。
    settle_frames: 10
    settle_dt: 0.005      # 窗口内最大平移偏差（米）
    settle_ddeg: 1.5      # 窗口内最大旋转偏差（度）
    settle_timeout: 3.0   # 超时（秒）
    smooth: 0.0
    motion_predict: 0.0
    fp_debug: false
    fp_debug_dir: /tmp/fp_debug

    # 注册门槛：YOLO 置信度 >= 0.85 才认为可以提交给 SAM/FoundationPose。
    # 背景误检常见于 0.7 左右，调高可以避免反复注册导致画面卡。
    det_acquire_conf: 0.85
    det_select: conf
    det_class: ""
    # 手动框（opt-in，默认关闭）："x,y,w,h" 像素坐标，左上角原点。
    # 非空时完全绕过 YOLO，直接用这个框做 SAM 分割和注册，用于 YOLO
    # 还没训练好时先验证 FoundationPose 的注册/跟踪效果。
    # 运行中改完调用 /foundationpose/reacquire 立即生效：
    #   ros2 param set /foundationpose manual_rect "300,200,120,150"
    # 清空（恢复 YOLO）：ros2 param set /foundationpose manual_rect ""
    manual_rect: ""
    # 同一个框连续稳定出现 3 帧才注册
    det_stable_frames: 3
    det_stable_iou: 0.5
    # 注册后 mesh 投影必须和检测框有至少这个 IoU，否则丢弃
    reg_min_iou: 0.15
    # YOLO 跟踪校验：FP 投影框和 YOLO 框的 IoU 连续过低/连续漏检才重新注册。
    # 这里刻意放宽，避免快速运动时投影暂时滞后就被误判为跟丢。
    yolo_track_check: true
    yolo_lock_iou: 0.15
    yolo_lost_frames: 15
    yolo_miss_frames: 30
    det_max_age: 1.0
    det_timeout: 0.5
    # 分割/注册失败后的重试冷却时间（秒），避免每帧都跑 SAM+注册
    acquire_cooldown: 1.5
    # 注册失败的框（多半是背景误检）在 bad_rect_ttl 秒内不再重试，
    # 避免每隔几秒就再卡一次 3 秒的注册
    bad_rect_ttl: 10.0
    bad_rect_iou: 0.4

    # 摄像头节点发布 32FC1 米制深度；只有接 16UC1 时才用 depth_scale
    depth_scale: 0.001
    max_stamp_diff: 0.05
    camera_frame: camera_color_optical_frame
    object_frame: object

    publish_tf: true
    publish_debug_image: true
    # 调试图里在 mesh 原点画物体坐标轴（红X 绿Y 蓝Z），轴长单位米
    draw_axes: true
    axis_length: 0.05
    debug_rate: 30.0
    processing_rate: 30.0
    # 每隔多少秒打印一次实际 tick/debug/pose 频率（0 关闭）
    rate_log_period: 5.0

    color_topic: /camera/color/image_raw
    depth_topic: /camera/depth/image_raw
    camera_info_topic: /camera/color/camera_info
    detections_topic: /yolo/detections
    pose_topic: /foundationpose/object_pose
    status_topic: /foundationpose/status
    debug_image_topic: /foundationpose/debug_image

image_viewer:
  ros__parameters:
    # 想看原始摄像头画面就改成 /camera/color/image_raw
    image_topic: /foundationpose/debug_image
    window_name: FoundationPose ROS
    display_rate: 30.0
